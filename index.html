<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#060912" />
  <title>Neural Learning Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset & Base ─────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow-x: hidden; }
    body {
      background: #060912;
      color: #E8EAF0;
      font-family: 'DM Mono', 'Courier New', monospace;
      min-height: 100vh;
      min-height: -webkit-fill-available;
    }

    /* ── CSS Variables ────────────────────────── */
    :root {
      --cyan: #00D4FF;
      --purple: #A78BFA;
      --green: #34D399;
      --orange: #FB923C;
      --bg: #060912;
      --surface: rgba(255,255,255,0.03);
      --border: rgba(255,255,255,0.08);
      --text-dim: #7880A0;
      --text-muted: #4A5070;
    }

    /* ── Animations ───────────────────────────── */
    @keyframes floatP  { 0%,100%{transform:translateY(0)}  50%{transform:translateY(-14px)} }
    @keyframes fadeUp  { from{opacity:0;transform:translateY(22px)} to{opacity:1;transform:translateY(0)} }
    @keyframes fadeIn  { from{opacity:0} to{opacity:1} }
    @keyframes blink   { 0%,100%{opacity:1} 50%{opacity:0} }
    @keyframes scanln  { 0%{top:-10%} 100%{top:115%} }
    @keyframes shimmer { 0%{background-position:200% center} 100%{background-position:-200% center} }
    @keyframes spin    { to{transform:rotate(360deg)} }
    @keyframes pulse   { 0%,100%{opacity:0.4;transform:scale(1)} 50%{opacity:1;transform:scale(1.05)} }

    .fade-up  { animation: fadeUp 0.45s ease forwards; }
    .fade-in  { animation: fadeIn 0.3s ease forwards; }
    .blink    { animation: blink 0.9s step-end infinite; color: var(--cyan); }

    /* ── Particles ────────────────────────────── */
    #particles {
      position: fixed; inset: 0;
      pointer-events: none; z-index: 0; overflow: hidden;
    }
    .particle {
      position: absolute;
      border-radius: 50%;
      animation: floatP linear infinite;
    }

    /* ── Scanline ─────────────────────────────── */
    .scanline {
      position: fixed; left: 0; right: 0; height: 80px;
      background: linear-gradient(transparent, rgba(0,212,255,0.015), transparent);
      animation: scanln 10s linear infinite;
      pointer-events: none; z-index: 1;
    }

    /* ── Layout ───────────────────────────────── */
    #app {
      position: relative; z-index: 2;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 24px 20px;
      padding-bottom: max(24px, env(safe-area-inset-bottom));
    }
    .screen {
      width: 100%; max-width: 520px;
      display: none;
    }
    .screen.active { display: block; }

    /* ── Progress Bar ─────────────────────────── */
    .progress {
      display: flex; gap: 6px; margin-bottom: 32px;
    }
    .progress-seg {
      flex: 1; height: 3px; border-radius: 2px;
      background: var(--border);
      transition: background 0.35s;
    }
    .progress-seg.done  { background: var(--cyan); }
    .progress-seg.active{ background: rgba(0,212,255,0.38); }

    /* ── Typography ───────────────────────────── */
    .label {
      font-size: 11px; letter-spacing: 0.3em;
      color: rgba(0,212,255,0.45);
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(40px, 12vw, 72px);
      font-weight: 800; line-height: 1.0;
      margin-bottom: 18px;
      background: linear-gradient(135deg, #ffffff 35%, var(--cyan) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    h2.question {
      font-family: 'Syne', sans-serif;
      font-size: clamp(20px, 5vw, 26px);
      font-weight: 700; line-height: 1.35;
      color: #E8EAF0;
      margin-bottom: 28px;
    }
    .subtitle {
      color: var(--text-dim); font-size: 15px;
      line-height: 1.75; max-width: 380px;
      margin: 0 auto 44px;
    }
    .q-counter {
      font-size: 11px; color: var(--text-dim);
      letter-spacing: 0.2em; margin-bottom: 14px;
    }

    /* ── Buttons ──────────────────────────────── */
    .btn-cta {
      display: block; width: 100%;
      background: linear-gradient(135deg, rgba(0,212,255,0.13), rgba(167,139,250,0.13));
      border: 1px solid rgba(0,212,255,0.32);
      border-radius: 14px;
      padding: 17px 28px;
      color: var(--cyan);
      font-family: 'DM Mono', monospace;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.04em;
      -webkit-appearance: none;
      text-align: center;
    }
    .btn-cta:active { transform: scale(0.98); background: rgba(0,212,255,0.18); }
    .btn-cta:disabled { opacity: 0.35; cursor: not-allowed; }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 17px 18px;
      color: #5A6280;
      font-family: 'DM Mono', monospace;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      -webkit-appearance: none;
      white-space: nowrap;
    }
    .btn-ghost:active { border-color: rgba(255,255,255,0.25); color: #9CA3C0; }

    .btn-row {
      display: flex; gap: 10px; margin-top: 12px;
      flex-wrap: wrap;
    }
    .btn-row .btn-cta { flex: 1; min-width: 160px; }

    /* ── Option Buttons ───────────────────────── */
    .options { display: flex; flex-direction: column; gap: 10px; }
    .opt {
      display: flex; align-items: center; gap: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 17px 18px;
      cursor: pointer;
      transition: all 0.18s;
      color: #C8CADF;
      font-family: 'DM Mono', monospace;
      font-size: 14px;
      text-align: left;
      width: 100%;
      -webkit-appearance: none;
      min-height: 58px;
    }
    .opt:active { transform: translateX(3px); background: rgba(255,255,255,0.06); }
    .opt.selected {
      background: rgba(0,212,255,0.1);
      border-color: rgba(0,212,255,0.45);
      color: var(--cyan);
    }
    .opt:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .opt-icon { font-size: 18px; opacity: 0.6; min-width: 24px; text-align: center; flex-shrink: 0; }

    /* ── Profile Card ─────────────────────────── */
    .profile-card {
      border-radius: 18px;
      padding: 28px;
      margin-bottom: 28px;
    }
    .profile-emoji { font-size: 40px; margin-bottom: 14px; display: block; }
    .profile-name {
      font-family: 'Syne', sans-serif;
      font-size: 28px; font-weight: 800;
      margin-bottom: 10px;
    }
    .profile-desc { color: #9CA3C0; line-height: 1.75; font-size: 15px; }

    /* ── Topic Input ──────────────────────────── */
    .input-label {
      font-size: 12px; color: #5A6280;
      letter-spacing: 0.12em; text-transform: uppercase;
      margin-bottom: 12px; display: block;
    }
    .topic-input {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      padding: 16px 18px;
      color: #E8EAF0;
      font-family: 'DM Mono', monospace;
      font-size: 16px;
      outline: none;
      width: 100%;
      transition: border-color 0.2s;
      -webkit-appearance: none;
    }
    .topic-input:focus { border-color: rgba(0,212,255,0.5); }
    .topic-input::placeholder { color: #2A3050; }

    /* ── Lesson Box ───────────────────────────── */
    .lesson-header {
      display: flex; align-items: center; gap: 14px;
      margin-bottom: 22px;
    }
    .lesson-emoji { font-size: 24px; flex-shrink: 0; }
    .lesson-sublabel {
      font-size: 10px; color: #5A6280;
      letter-spacing: 0.2em; text-transform: uppercase;
      margin-bottom: 3px;
    }
    .lesson-topic {
      font-family: 'Syne', sans-serif;
      font-weight: 700; font-size: 17px; color: #E8EAF0;
    }
    .lesson-content {
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
      padding: 24px;
      min-height: 200px;
      line-height: 1.9;
      font-size: 15px;
      color: #C8CADF;
      margin-bottom: 20px;
      white-space: pre-wrap;
    }

    /* ── Loading Spinner ──────────────────────── */
    .loading-wrap {
      display: flex; align-items: center; gap: 12px;
      color: var(--text-muted);
    }
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(0,212,255,0.2);
      border-top-color: var(--cyan);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }
    .loading-text { color: #4A5070; font-size: 14px; }

    /* ── Error Box ────────────────────────────── */
    .error-box {
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 12px;
      padding: 14px 18px;
      color: #FCA5A5;
      font-size: 13px; line-height: 1.6;
      margin-bottom: 16px;
    }

    /* ── Intro center layout ──────────────────── */
    #screen-intro { text-align: center; }
    #screen-intro .subtitle { margin: 0 auto 44px; }

    /* ── Mobile tweaks ────────────────────────── */
    @media (max-width: 400px) {
      #app { padding: 20px 16px; }
      .opt { padding: 15px 14px; font-size: 13px; }
      .btn-cta, .btn-ghost { font-size: 13px; padding: 15px 16px; }
      .lesson-content { padding: 18px; font-size: 14px; }
      h1 { font-size: clamp(38px, 13vw, 56px); }
    }
  </style>
</head>
<body>

<!-- Particles -->
<div id="particles"></div>
<div class="scanline"></div>

<div id="app">

  <!-- ── INTRO ── -->
  <div id="screen-intro" class="screen active fade-up">
    <div class="label">Neural Learning System · v1.0</div>
    <h1>How do<br>you learn?</h1>
    <p class="subtitle">5 questions. 2 minutes. A personalized AI tutor that teaches anything exactly the way your brain absorbs it best.</p>
    <button class="btn-cta" onclick="startQuiz()" style="max-width:280px;margin:0 auto;">Begin Assessment</button>
  </div>

  <!-- ── QUIZ ── -->
  <div id="screen-quiz" class="screen">
    <div class="progress" id="progress"></div>
    <div class="q-counter" id="q-counter"></div>
    <h2 class="question" id="q-text"></h2>
    <div class="options" id="q-options"></div>
  </div>

  <!-- ── PROFILE ── -->
  <div id="screen-profile" class="screen">
    <div class="label">Your Learning Profile</div>
    <div class="profile-card" id="profile-card">
      <span class="profile-emoji" id="profile-emoji"></span>
      <div class="profile-name" id="profile-name"></div>
      <div class="profile-desc" id="profile-desc"></div>
    </div>
    <label class="input-label" for="topic-input">What do you want to learn today?</label>
    <input class="topic-input" id="topic-input" type="text"
      placeholder="e.g. machine learning, stoicism, jazz theory..."
      autocomplete="off" autocorrect="off" autocapitalize="off"
      onkeydown="if(event.key==='Enter') generateLesson()" />
    <div class="btn-row">
      <button class="btn-cta" id="generate-btn" onclick="generateLesson()">Generate My Lesson</button>
      <button class="btn-ghost" onclick="resetApp()">↺</button>
    </div>
  </div>

  <!-- ── LESSON ── -->
  <div id="screen-lesson" class="screen">
    <div class="lesson-header">
      <span class="lesson-emoji" id="lesson-emoji"></span>
      <div>
        <div class="lesson-sublabel" id="lesson-sublabel"></div>
        <div class="lesson-topic" id="lesson-topic"></div>
      </div>
    </div>
    <div id="error-box" class="error-box" style="display:none;"></div>
    <div class="lesson-content" id="lesson-content">
      <div class="loading-wrap">
        <div class="spinner"></div>
        <span class="loading-text">Generating your personalized lesson…</span>
      </div>
    </div>
    <div class="btn-row" id="lesson-actions" style="display:none;">
      <button class="btn-cta" onclick="backToProfile()">Learn Something Else</button>
      <button class="btn-ghost" onclick="retryLesson()">↺ Retry</button>
      <button class="btn-ghost" onclick="resetApp()">⟳</button>
    </div>
  </div>

</div>

<script>
// ── Data ─────────────────────────────────────────
const QUESTIONS = [
  {
    id: "style",
    question: "When learning something new, you naturally…",
    options: [
      { label: "Draw diagrams or visualize it mentally", value: "visual", icon: "◈" },
      { label: "Read articles and take notes", value: "reading", icon: "◎" },
      { label: "Jump in and try it hands-on", value: "kinesthetic", icon: "◉" },
      { label: "Listen to explanations or podcasts", value: "auditory", icon: "◌" },
    ],
  },
  {
    id: "pace",
    question: "Your ideal learning approach is…",
    options: [
      { label: "Master one concept deeply before moving on", value: "visual", icon: "▼" },
      { label: "Get the big picture first, then zoom in", value: "reading", icon: "▲" },
      { label: "Learn just what I need for a task right now", value: "kinesthetic", icon: "►" },
      { label: "Explore freely without a set structure", value: "auditory", icon: "◆" },
    ],
  },
  {
    id: "retention",
    question: "Information sticks best for you when you…",
    options: [
      { label: "Explain it to someone else", value: "auditory", icon: "⊕" },
      { label: "Use spaced repetition / flashcards", value: "reading", icon: "⊗" },
      { label: "Apply it in a real project immediately", value: "kinesthetic", icon: "⊙" },
      { label: "Connect it to something you already know", value: "visual", icon: "⊖" },
    ],
  },
  {
    id: "focus",
    question: "Your natural focus pattern is…",
    options: [
      { label: "Short intense bursts (15–25 min)", value: "kinesthetic", icon: "▪" },
      { label: "Long deep sessions (1–2+ hours)", value: "reading", icon: "▬" },
      { label: "Flexible — depends on my energy", value: "visual", icon: "▫" },
      { label: "Scattered but frequent throughout the day", value: "auditory", icon: "▭" },
    ],
  },
  {
    id: "motivation",
    question: "What keeps you going when learning gets tough?",
    options: [
      { label: "Clear goals and milestones to hit", value: "reading", icon: "✦" },
      { label: "Curiosity and the joy of discovery", value: "visual", icon: "✧" },
      { label: "Challenges and competing with myself", value: "kinesthetic", icon: "✱" },
      { label: "Seeing real-world progress and results", value: "auditory", icon: "✴" },
    ],
  },
];

const PROFILES = {
  visual:     { name: "The Architect", color: "#00D4FF", emoji: "◈", desc: "You think in systems and structures. You need to SEE how things connect before they make sense." },
  reading:    { name: "The Scholar",   color: "#A78BFA", emoji: "◎", desc: "Words are your medium. You process deeply through text and build mental models through careful reading." },
  kinesthetic:{ name: "The Builder",   color: "#34D399", emoji: "◉", desc: "You learn by doing. Theory only clicks once your hands are in it — you need to build, break, and rebuild." },
  auditory:   { name: "The Listener",  color: "#FB923C", emoji: "◌", desc: "Sound and rhythm carry meaning for you. Conversations, talks, and narration are your richest learning channels." },
};

const STYLE_MAP = {
  visual:      "Use spatial metaphors, describe visual hierarchies, and map out how concepts connect to each other like a diagram described in words.",
  reading:     "Write in dense, rich prose with precise vocabulary. Use well-structured paragraphs, clear definitions, and logical flow.",
  kinesthetic: "Lead with a hands-on exercise or immediate challenge. Explain through doing — concrete step-by-step actions first, theory second.",
  auditory:    "Write conversationally, as if speaking. Use rhythm, repetition, rhetorical questions, and natural spoken patterns.",
};

// ── State ─────────────────────────────────────────
let current = 0;
let answers = {};
let profile = null;
let lastTopic = "";
let answerLocked = false;
let typingTimer = null;

// ── Particles ──────────────────────────────────────
(function buildParticles() {
  const container = document.getElementById("particles");
  for (let i = 0; i < 22; i++) {
    const d = document.createElement("div");
    d.className = "particle";
    const size = i % 3 === 0 ? 2 : 1;
    d.style.cssText = `
      width:${size}px; height:${size}px;
      background:hsl(${180 + i * 15},80%,70%);
      left:${(i * 37) % 100}%;
      top:${(i * 53) % 100}%;
      animation-duration:${4 + (i % 5)}s;
      animation-delay:${(i * 0.4) % 4}s;
      opacity:0.35;
    `;
    container.appendChild(d);
  }
})();

// ── Screen management ──────────────────────────────
function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  const el = document.getElementById("screen-" + id);
  el.classList.add("active");
  // Trigger animation
  el.classList.remove("fade-up");
  void el.offsetWidth;
  el.classList.add("fade-up");
}

// ── Quiz ───────────────────────────────────────────
function startQuiz() {
  current = 0;
  answers = {};
  answerLocked = false;
  renderQuestion();
  showScreen("quiz");
}

function renderQuestion() {
  const q = QUESTIONS[current];

  // Progress
  const prog = document.getElementById("progress");
  prog.innerHTML = QUESTIONS.map((_, i) => {
    const cls = i < current ? "done" : i === current ? "active" : "";
    return `<div class="progress-seg ${cls}"></div>`;
  }).join("");

  document.getElementById("q-counter").textContent = `${current + 1} / ${QUESTIONS.length}`;
  document.getElementById("q-text").textContent = q.question;

  const opts = document.getElementById("q-options");
  opts.innerHTML = q.options.map((opt, i) => `
    <button class="opt" onclick="handleAnswer('${opt.value}', this)" id="opt-${i}">
      <span class="opt-icon">${opt.icon}</span>
      <span>${opt.label}</span>
    </button>
  `).join("");
}

function handleAnswer(val, btn) {
  if (answerLocked) return;
  answerLocked = true;

  btn.classList.add("selected");
  document.querySelectorAll(".opt").forEach(b => b.disabled = true);

  setTimeout(() => {
    answers[QUESTIONS[current].id] = val;
    current++;
    answerLocked = false;

    if (current < QUESTIONS.length) {
      renderQuestion();
      const screen = document.getElementById("screen-quiz");
      screen.classList.remove("fade-up");
      void screen.offsetWidth;
      screen.classList.add("fade-up");
    } else {
      profile = computeProfile();
      showProfile();
    }
  }, 380);
}

function computeProfile() {
  const counts = { visual: 0, reading: 0, kinesthetic: 0, auditory: 0 };
  Object.values(answers).forEach(v => { if (v in counts) counts[v]++; });
  return Object.entries(counts).sort((a, b) => b[1] - a[1])[0][0];
}

// ── Profile ────────────────────────────────────────
function showProfile() {
  const p = PROFILES[profile];

  const card = document.getElementById("profile-card");
  card.style.border = `1px solid ${p.color}44`;
  card.style.background = `${p.color}09`;

  document.getElementById("profile-emoji").textContent = p.emoji;
  document.getElementById("profile-name").textContent = p.name;
  document.getElementById("profile-name").style.color = p.color;
  document.getElementById("profile-desc").textContent = p.desc;
  document.getElementById("topic-input").value = "";

  showScreen("profile");
  setTimeout(() => document.getElementById("topic-input").focus(), 400);
}

// ── Lesson ─────────────────────────────────────────
async function generateLesson() {
  const topic = document.getElementById("topic-input").value.trim();
  if (!topic || !profile) return;
  lastTopic = topic;
  await fetchLesson(topic, profile);
}

async function retryLesson() {
  if (lastTopic && profile) await fetchLesson(lastTopic, profile);
}

async function fetchLesson(topic, profileKey) {
  const p = PROFILES[profileKey];

  // Setup lesson screen
  document.getElementById("lesson-emoji").textContent = p.emoji;
  document.getElementById("lesson-emoji").style.color = p.color;
  document.getElementById("lesson-sublabel").textContent = `${p.name} · Lesson`;
  document.getElementById("lesson-topic").textContent = topic;
  document.getElementById("lesson-content").innerHTML = `
    <div class="loading-wrap">
      <div class="spinner"></div>
      <span class="loading-text">Generating your personalized lesson…</span>
    </div>`;
  document.getElementById("error-box").style.display = "none";
  document.getElementById("lesson-actions").style.display = "none";
  showScreen("lesson");

  try {
    const res = await fetch("/api/lesson", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        topic,
        profileName: p.name,
        profileDesc: p.desc,
        styleInstruction: STYLE_MAP[profileKey],
      }),
    });

    const data = await res.json();
    if (data.error) throw new Error(data.error);

    typeLesson(data.lesson);
  } catch (err) {
    document.getElementById("lesson-content").innerHTML = "";
    const errBox = document.getElementById("error-box");
    errBox.textContent = "⚠ " + (err.message || "Something went wrong. Please try again.");
    errBox.style.display = "block";
    document.getElementById("lesson-actions").style.display = "flex";
  }
}

function typeLesson(text) {
  const el = document.getElementById("lesson-content");
  el.innerHTML = "";
  let i = 0;
  if (typingTimer) clearInterval(typingTimer);

  typingTimer = setInterval(() => {
    if (i < text.length) {
      el.textContent = text.slice(0, i + 1);
      i++;
    } else {
      clearInterval(typingTimer);
      // Remove cursor, show actions
      document.getElementById("lesson-actions").style.display = "flex";
      document.getElementById("lesson-actions").classList.add("fade-in");
    }
  }, 12);
}

// ── Navigation ─────────────────────────────────────
function backToProfile() {
  if (typingTimer) clearInterval(typingTimer);
  document.getElementById("topic-input").value = "";
  showScreen("profile");
  setTimeout(() => document.getElementById("topic-input").focus(), 400);
}

function resetApp() {
  if (typingTimer) clearInterval(typingTimer);
  current = 0; answers = {}; profile = null;
  lastTopic = ""; answerLocked = false;
